services:
  - type: web
    name: altitude-gateway
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd node-backend && npm install
    startCommand: cd node-backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
